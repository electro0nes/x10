id: detect-electro0neinject

info:
  name: Detect electro0neinject Patterns and Server Errors
  author: MoeinErfanian
  severity: medium
  description: |
    This template detects specific electro0neinject patterns in HTTP response bodies
    and reports any HTTP 500 status code as informational.

requests:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: or
    matchers:
      - type: word
        name: xss-test
        words:
          - ">xxxx"
          - 'xxxx""'
          - "xxxx''"
          - 'xxxx\\""'
          - "xxxx\\''"
          - "xxxx)"
          - "(xxxx"
          - "xxxx;"
        part: body
        condition: or
      - type: status
        name: server-error
        status:
          - 500

  - method: POST
    path:
      - "{{BaseURL}}"
    matchers-condition: or
    matchers:
      - type: word
        name: xss-test
        words:
          - ">xxxx"
          - 'xxxx""'
          - "xxxx''"
          - 'xxxx\\""'
          - "xxxx\\''"
          - "xxxx)"
          - "(xxxx"
          - "xxxx;"
        part: body
        condition: or
      - type: status
        name: server-error
        status:
          - 500